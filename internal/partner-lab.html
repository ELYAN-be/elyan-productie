<!DOCTYPE html>
<html lang="nl-BE">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELYAN Partner Lab · Product experience (intern)</title>
<meta name="description" content="Interne demo van het toekomstige ELYAN-vakmannennetwerk. Fictieve demo-data.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#3F4A32">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<link rel="stylesheet" href="/css/partner-lab.css">
</head>
<body class="page-partner-lab">
<a href="#lab-main" class="skip-link">Ga naar inhoud</a>

<svg style="display:none" aria-hidden="true"><defs>
<symbol id="i-logo" viewBox="0 0 32 32"><rect x="4" y="14" width="6" height="14" rx="2" fill="currentColor"/><rect x="13" y="8" width="6" height="20" rx="2" fill="currentColor"/><rect x="22" y="2" width="6" height="26" rx="2" fill="currentColor"/></symbol>
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l5 5L19 7" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></symbol>
<symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.2l2.4 4.9 5.4.8-3.9 3.8.9 5.4L12 15.6 7.2 18.1l.9-5.4L4.2 8.9l5.4-.8L12 3.2z" fill="currentColor"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.75"/><path d="M16.2 16.2L20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></symbol>
</defs></svg>

<div class="lab-switcher" role="navigation" aria-label="Partner Lab views">
  <div class="lab-switcher-inner">
    <div class="lab-switcher-brand">
      <span class="lab-switcher-badge">Internal Lab</span>
      <strong>ELYAN Partner Lab</strong>
      <span class="lab-switcher-note">Fictieve demo-data · geen productie</span>
    </div>
    <div class="lab-switcher-tabs" role="tablist">
      <button type="button" class="lab-tab is-active" data-lab-view="discover">Vakmannen ontdekken</button>
      <button type="button" class="lab-tab" data-lab-view="profile">Vakmanprofiel</button>
      <button type="button" class="lab-tab" data-lab-view="partner">Partneromgeving</button>
      <button type="button" class="lab-tab" data-lab-view="admin">ELYAN Admin</button>
    </div>
  </div>
</div>

<main id="lab-main">
  <div class="lab-view is-active" id="view-discover" data-view="discover"></div>
  <div class="lab-view" id="view-profile" data-view="profile" hidden></div>
  <div class="lab-view" id="view-quote" data-view="quote" hidden></div>
  <div class="lab-view" id="view-partner" data-view="partner" hidden></div>
  <div class="lab-view" id="view-admin" data-view="admin" hidden></div>
</main>

<div class="lab-lightbox" id="labLightbox" hidden>
  <div class="lab-lightbox-backdrop" data-close-lightbox></div>
  <button type="button" class="lab-lightbox-close" data-close-lightbox aria-label="Sluiten"><svg class="icon"><use href="#i-close"></use></svg></button>
  <img id="labLightboxImg" src="" alt="Projectfoto">
</div>

<div class="lab-drawer" id="filtersDrawer" hidden>
  <div class="lab-drawer-backdrop" data-close-drawer></div>
  <div class="lab-drawer-panel" role="dialog" aria-modal="true" aria-label="Filters">
    <div class="lab-drawer-head">
      <strong>Filters</strong>
      <button type="button" class="lab-modal-close" data-close-drawer aria-label="Sluiten"><svg class="icon"><use href="#i-close"></use></svg></button>
    </div>
    <div id="filtersDrawerBody"></div>
  </div>
</div>

<script src="/shared/vakmannen/intelligence.js"></script>
<script src="/shared/vakmannen/qa-seeds.js"></script>
<script src="/js/partner-lab.js" defer></script>
</body>
</html>
