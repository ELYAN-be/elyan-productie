<!DOCTYPE html>
<html lang="nl-BE">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wachtwoord vergeten | ELYAN for Professionals</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#3F4A32">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/styles.css">
<link rel="stylesheet" href="/css/partner-lab.css">
<link rel="stylesheet" href="/css/professionals.css">
</head>
<body class="page-partner-lab page-professionals">
<main class="prof-shell">
  <p class="lab-kicker">ELYAN for Professionals</p>
  <h1 style="font-size:1.8rem;margin:0 0 10px;">Wachtwoord vergeten</h1>
  <p class="lab-hint">We sturen een herstellink naar je e-mailadres via Supabase Auth.</p>
  <form id="forgotForm" class="prof-card" novalidate>
    <label class="lab-field">E-mail<input id="email" type="email" autocomplete="username" required></label>
    <button type="submit" class="btn btn-primary btn-block">Verstuur herstellink</button>
    <p id="forgotStatus" class="prof-status" hidden></p>
    <div class="prof-links">
      <a class="lab-link" href="/professionals/login">Terug naar login</a>
    </div>
  </form>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/js/professionals/core.js"></script>
<script src="/js/professionals/forgot-password.js"></script>
</body>
</html>
