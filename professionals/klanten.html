<!DOCTYPE html>
<html lang="nl-BE">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELYAN Control | Klanten</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#3F4A32">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/styles.css">
<link rel="stylesheet" href="/css/partner-lab.css">
<link rel="stylesheet" href="/css/professionals.css">
</head>
<body class="page-partner-lab page-professionals page-control page-control-customers">
<a href="#ctrlMain" class="skip-link">Ga naar inhoud</a>

<header class="ctrl-top">
  <div class="ctrl-top-inner">
    <div class="ctrl-brand">
      <p class="lab-kicker">ELYAN Control</p>
      <h1 class="ctrl-title">Klanten</h1>
      <nav class="ctrl-mode-nav" aria-label="Control-onderdelen">
        <a href="/professionals/overzicht">Overzicht</a>
        <a href="/professionals/control">Partners</a>
        <a href="/professionals/aanvragen">Aanvragen</a>
        <a href="/professionals/klanten" aria-current="page">Klanten</a>
        <a href="/professionals/rapportage">Rapportage</a>
      </nav>
    </div>
    <div class="ctrl-top-actions">
      <span id="ctrlUser" class="ctrl-user" hidden></span>
      <button type="button" class="btn btn-ghost btn-sm" id="ctrlLogout">Uitloggen</button>
    </div>
  </div>
</header>

<main id="ctrlMain" class="ctrl-shell">
  <p id="ctrlGate" class="prof-status is-info" hidden>Laden…</p>

  <section id="ctrlListView" class="ctrl-view" hidden>
    <div class="ctrl-toolbar">
      <p class="lab-hint" id="ctrlListHint">Identiteit = genormaliseerd e-mailadres. Geen fuzzy matching.</p>
      <p id="ctrlListMeta" class="ctrl-list-meta"></p>
    </div>
    <div id="ctrlList" class="ctrl-list" role="list"></div>
  </section>

  <section id="ctrlDetailView" class="ctrl-view" hidden>
    <div class="ctrl-review-top">
      <button type="button" class="btn btn-ghost btn-sm" id="ctrlBackList">← Terug naar lijst</button>
      <div class="ctrl-review-head">
        <div>
          <p class="lab-kicker">Klant</p>
          <h2 class="ctrl-review-name" id="ctrlDetailName"></h2>
          <p class="ctrl-review-sub" id="ctrlDetailSub"></p>
        </div>
      </div>
    </div>
    <div class="ctrl-review-grid">
      <div class="ctrl-review-main">
        <div class="ctrl-section">
          <h3 class="ctrl-section-title">Identiteit &amp; contact</h3>
          <dl class="ctrl-dl" id="ctrlIdentityFields"></dl>
        </div>
        <div class="ctrl-section">
          <h3 class="ctrl-section-title">Actieve aanvragen</h3>
          <div id="ctrlActiveRequests" class="ctrl-list" role="list"></div>
        </div>
        <div class="ctrl-section">
          <h3 class="ctrl-section-title">Historiek</h3>
          <div id="ctrlHistory" class="ctrl-review-items"></div>
        </div>
      </div>
      <aside class="ctrl-aside">
        <div class="ctrl-panel">
          <h3 class="ctrl-section-title">Samenvatting</h3>
          <dl class="ctrl-dl" id="ctrlSummaryFields"></dl>
        </div>
      </aside>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/js/professionals/core.js"></script>
<script src="/js/professionals/control-customers.js"></script>
</body>
</html>
