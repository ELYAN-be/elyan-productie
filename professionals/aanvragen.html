<!DOCTYPE html>
<html lang="nl-BE">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELYAN Control | Aanvragen</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#3F4A32">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/styles.css">
<link rel="stylesheet" href="/css/partner-lab.css">
<link rel="stylesheet" href="/css/professionals.css">
</head>
<body class="page-partner-lab page-professionals page-control page-control-requests">
<a href="#ctrlMain" class="skip-link">Ga naar inhoud</a>

<header class="ctrl-top">
  <div class="ctrl-top-inner">
    <div class="ctrl-brand">
      <p class="lab-kicker">ELYAN Control</p>
      <h1 class="ctrl-title">Aanvragen</h1>
      <nav class="ctrl-mode-nav" aria-label="Control-onderdelen">
        <a href="/professionals/control">Partners</a>
        <a href="/professionals/aanvragen" aria-current="page">Aanvragen</a>
      </nav>
    </div>
    <div class="ctrl-top-actions">
      <span id="ctrlUser" class="ctrl-user" hidden></span>
      <button type="button" class="btn btn-ghost btn-sm" id="ctrlLogout">Uitloggen</button>
    </div>
  </div>
</header>

<main id="ctrlMain" class="ctrl-shell">
  <p id="ctrlGate" class="prof-status is-info" hidden>Laden…</p>

  <section id="ctrlListView" class="ctrl-view" hidden>
    <div class="ctrl-toolbar">
      <nav class="ctrl-filters" aria-label="Statusfilter" id="ctrlFilters">
        <button type="button" class="ctrl-filter is-active" data-status="all">Alles</button>
        <button type="button" class="ctrl-filter" data-status="new">Nieuw</button>
        <button type="button" class="ctrl-filter" data-status="contacted">Gecontacteerd</button>
        <button type="button" class="ctrl-filter" data-status="qualified">Gekwalificeerd</button>
        <button type="button" class="ctrl-filter" data-status="closed_won">Gewonnen</button>
        <button type="button" class="ctrl-filter" data-status="closed_lost">Verloren</button>
      </nav>
      <p id="ctrlListMeta" class="ctrl-list-meta"></p>
    </div>
    <div class="ctrl-toolbar ctrl-toolbar-secondary">
      <label class="ctrl-field">
        <span class="ctrl-field-label">Categorie</span>
        <input type="text" id="ctrlFilterCategory" class="ctrl-input" placeholder="bijv. dakwerken" autocomplete="off">
      </label>
      <label class="ctrl-field">
        <span class="ctrl-field-label">Partner-slug</span>
        <input type="text" id="ctrlFilterPartner" class="ctrl-input" placeholder="bijv. acme-dak" autocomplete="off">
      </label>
      <button type="button" class="btn btn-ghost btn-sm" id="ctrlApplyFilters">Filteren</button>
    </div>
    <div id="ctrlList" class="ctrl-list" role="list"></div>
  </section>

  <section id="ctrlDetailView" class="ctrl-view" hidden>
    <div class="ctrl-review-top">
      <button type="button" class="btn btn-ghost btn-sm" id="ctrlBackList">← Terug naar lijst</button>
      <div class="ctrl-review-head">
        <div>
          <p class="lab-kicker" id="ctrlDetailKicker">Klantaanvraag</p>
          <h2 class="ctrl-review-name" id="ctrlDetailName"></h2>
          <p class="ctrl-review-sub" id="ctrlDetailSub"></p>
        </div>
        <div class="ctrl-badges" id="ctrlBadges"></div>
      </div>
    </div>

    <div class="ctrl-review-grid">
      <div class="ctrl-review-main">
        <div class="ctrl-section">
          <h3 class="ctrl-section-title">Klantgegevens</h3>
          <dl class="ctrl-dl" id="ctrlCustomerFields"></dl>
        </div>
        <div class="ctrl-section">
          <h3 class="ctrl-section-title">Bericht</h3>
          <p class="ctrl-message" id="ctrlMessage"></p>
        </div>
        <div class="ctrl-section">
          <h3 class="ctrl-section-title">Statusgeschiedenis</h3>
          <div id="ctrlStatusEvents" class="ctrl-review-items"></div>
        </div>
      </div>

      <aside class="ctrl-aside">
        <div class="ctrl-panel">
          <h3 class="ctrl-section-title">Status</h3>
          <p id="ctrlActionHint" class="lab-hint"></p>
          <div class="ctrl-actions" id="ctrlActions"></div>
          <p id="ctrlActionStatus" class="prof-status" hidden></p>
        </div>
        <div class="ctrl-panel">
          <h3 class="ctrl-section-title">Context</h3>
          <dl class="ctrl-dl" id="ctrlContextFields"></dl>
        </div>
      </aside>
    </div>
  </section>
</main>

<dialog id="ctrlConfirm" class="ctrl-dialog">
  <form method="dialog" class="ctrl-dialog-inner">
    <h3 id="ctrlConfirmTitle">Bevestigen</h3>
    <p id="ctrlConfirmBody" class="lab-hint"></p>
    <div class="ctrl-dialog-actions">
      <button type="submit" value="cancel" class="btn btn-ghost">Annuleren</button>
      <button type="submit" value="confirm" class="btn btn-primary" id="ctrlConfirmOk">Bevestigen</button>
    </div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/js/professionals/core.js"></script>
<script src="/js/professionals/control-requests.js"></script>
</body>
</html>
