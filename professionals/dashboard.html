<!DOCTYPE html>
<html lang="nl-BE">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | ELYAN for Professionals</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#3F4A32">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/styles.css">
<link rel="stylesheet" href="/css/partner-lab.css">
<link rel="stylesheet" href="/css/professionals.css">
</head>
<body class="page-partner-lab page-professionals">
<main class="prof-shell prof-shell-wide">
  <p class="lab-kicker">ELYAN for Professionals</p>
  <h1 style="font-size:1.7rem;margin:0 0 8px;">Partner dashboard</h1>
  <p class="lab-hint">Beveiligde omgeving voor je vakbedrijf.</p>
  <p id="dashStatus" class="prof-status" hidden></p>
  <div id="dashShell" class="prof-card" hidden>
    <div class="prof-meta">
      <div><span>Partner</span><strong id="partnerLabel">—</strong></div>
      <div><span>Account</span><strong id="userEmail">—</strong></div>
      <div><span>Rol</span><strong id="userRole">—</strong></div>
    </div>
    <div class="prof-cta-block" id="onboardingCtaBlock">
      <p class="lab-hint" id="onboardingCtaHint" style="margin-top:16px;">Beheer je bedrijfsprofiel en onboarding.</p>
      <div class="prof-actions">
        <a class="btn btn-primary" id="onboardingCta" href="/professionals/onboarding">Naar onboarding</a>
        <button type="button" class="btn" id="logoutBtn">Uitloggen</button>
      </div>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/js/professionals/core.js"></script>
<script src="/js/professionals/onboarding-shell.js"></script>
<script src="/js/professionals/dashboard.js"></script>
</body>
</html>
