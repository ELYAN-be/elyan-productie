<!DOCTYPE html>
<html lang="nl-BE">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nieuw wachtwoord | ELYAN for Professionals</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#3F4A32">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/styles.css">
<link rel="stylesheet" href="/css/partner-lab.css">
<link rel="stylesheet" href="/css/professionals.css">
</head>
<body class="page-partner-lab page-professionals">
<main class="prof-shell">
  <p class="lab-kicker">ELYAN for Professionals</p>
  <h1 style="font-size:1.8rem;margin:0 0 10px;">Nieuw wachtwoord</h1>
  <p class="lab-hint">Kies een nieuw wachtwoord voor je ELYAN for Professionals-account.</p>
  <form id="resetForm" class="prof-card" novalidate>
    <label class="lab-field">Nieuw wachtwoord<input id="password" type="password" autocomplete="new-password" required minlength="8"></label>
    <label class="lab-field">Bevestig wachtwoord<input id="password2" type="password" autocomplete="new-password" required minlength="8"></label>
    <button type="submit" class="btn btn-primary btn-block">Wachtwoord opslaan</button>
    <p id="resetStatus" class="prof-status" hidden></p>
    <div class="prof-links">
      <a class="lab-link" href="/professionals/login">Naar login</a>
      <a class="lab-link" href="/professionals/forgot-password">Opnieuw een link aanvragen</a>
    </div>
  </form>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/js/professionals/core.js"></script>
<script src="/js/professionals/reset-password.js"></script>
</body>
</html>
